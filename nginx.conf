# ═══════════════════════════════════════════════════════════
# Vickkyaku Admin — nginx SPA server
#
#   • /healthz            → 200 OK, no auth (Coolify healthcheck)
#   • /assets/*           → cached 1 year, immutable (Vite hashes)
#   • /*.html             → no-cache (index.html must always be fresh)
#   • /*                  → SPA fallback: try files, else index.html
#
#   Basic auth guards everything EXCEPT /healthz.
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide version
    server_tokens off;

    # Max upload size for any future form posts. Static SPA doesn't
    # need much; uploads go directly to RustFS.
    client_max_body_size 4m;

    # ─── Compression ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ═══════════════════════════════════════════════════════
    # HEALTHCHECK — must come first, must opt out of auth
    # ═══════════════════════════════════════════════════════
    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ═══════════════════════════════════════════════════════
    # BASIC AUTH — applies to everything below
    # ═══════════════════════════════════════════════════════
    auth_basic "Vickkyaku Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ═══════════════════════════════════════════════════════
    # HASHED ASSETS — Vite emits /assets/index-ABC123.js.
    # Those filenames never change, so cache aggressively.
    # ═══════════════════════════════════════════════════════
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Also catch root-level static files with extensions
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ═══════════════════════════════════════════════════════
    # HTML — never cache. The HTML references the newest
    # hashed asset names, so it must always come fresh.
    # ═══════════════════════════════════════════════════════
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    # ═══════════════════════════════════════════════════════
    # SPA FALLBACK — any unmatched path serves index.html so
    # React Router can take over. This is what makes /products
    # and /settings work on a hard refresh.
    # ═══════════════════════════════════════════════════════
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # ═══════════════════════════════════════════════════════
    # SECURITY HEADERS
    # ═══════════════════════════════════════════════════════
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}